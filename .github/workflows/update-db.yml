name: DB Metadata Update

on:
  schedule:
    - cron: '0 3 * * 1,4'
  workflow_dispatch:

jobs:
  update-db:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Puppeteer
        run: npm install puppeteer

      - name: Write F95Zone cookies
        run: echo '${{ secrets.F95ZONE_COOKIES }}' > cookies.json

      - name: Run update script
        run: node update-db.js

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add local-game-db.json
          git diff --staged --quiet && echo "No changes to commit" || (git commit -m "auto: update game metadata $(date +%Y-%m-%d)" && git push)
