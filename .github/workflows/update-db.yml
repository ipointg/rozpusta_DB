name: Update DB

on:
  schedule:
    - cron: '0 21 * * *'  # Daily 21:00 UTC
  workflow_dispatch:       # Manual trigger

jobs:
  scrape-0:
    name: Scrape offset 0
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install puppeteer
        run: npm install puppeteer
      - name: Check secret
        env:
          F95ZONE_COOKIES: ${{ secrets.F95ZONE_COOKIES }}
        run: |
          if [ -z "$F95ZONE_COOKIES" ]; then
            echo "ERROR: F95ZONE_COOKIES is empty or not set"
            exit 1
          else
            echo "F95ZONE_COOKIES is set, length=${#F95ZONE_COOKIES}"
          fi
      - name: Run scraper
        env:
          F95ZONE_COOKIES: ${{ secrets.F95ZONE_COOKIES }}
        run: node update-db.js --offset 0 --limit 400
      - name: Upload patch
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: patch-0
          path: db-patch-0.json
          if-no-files-found: warn

  scrape-400:
    name: Scrape offset 400
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install puppeteer
        run: npm install puppeteer
      - name: Run scraper
        env:
          F95ZONE_COOKIES: ${{ secrets.F95ZONE_COOKIES }}
        run: node update-db.js --offset 400 --limit 400
      - name: Upload patch
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: patch-400
          path: db-patch-400.json
          if-no-files-found: warn

  scrape-800:
    name: Scrape offset 800
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install puppeteer
        run: npm install puppeteer
      - name: Run scraper
        env:
          F95ZONE_COOKIES: ${{ secrets.F95ZONE_COOKIES }}
        run: node update-db.js --offset 800 --limit 400
      - name: Upload patch
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: patch-800
          path: db-patch-800.json
          if-no-files-found: warn

  scrape-1200:
    name: Scrape offset 1200
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install puppeteer
        run: npm install puppeteer
      - name: Run scraper
        env:
          F95ZONE_COOKIES: ${{ secrets.F95ZONE_COOKIES }}
        run: node update-db.js --offset 1200 --limit 400
      - name: Upload patch
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: patch-1200
          path: db-patch-1200.json
          if-no-files-found: warn

  merge:
    name: Merge patches
    needs: [scrape-0, scrape-400, scrape-800, scrape-1200]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Download all patch artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: .
      - name: Apply patches and push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/ipointg/rozpusta_DB.git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          node merge-patches.js
          git add local-game-db.json
          git diff --cached --quiet && echo "No changes" || git commit -m "auto: daily DB status update [skip ci]"
          git push origin main
